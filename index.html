<body class="min-h-screen text-stone-900 antialiased selection:bg-vanilla-200 selection:text-stone-900">

  <!-- React Code with JSX -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ name, className = "w-5 h-5" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    // Simplified image path resolution targeting a strict 'images' directory
    const resolveImg = (filename) => {
      if (!filename) return "";
      return `./images/${filename}`;
    };

    const useScrollReveal = () => {
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
              }
            });
          },
          { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
        );

        const elements = document.querySelectorAll('.js-reveal');
        elements.forEach((el) => observer.observe(el));

        return () => observer.disconnect();
      }, []);
    };

    const AnimatedCounter = ({ target, suffix = "" }) => {
      const [count, setCount] = useState(0);
      const counterRef = useRef(null);
      const hasAnimated = useRef(false);

      useEffect(() => {
        const numericTarget = parseInt(target.replace(/[^0-9]/g, ''), 10) || 0;

        const observer = new IntersectionObserver(
          (entries) => {
            if (entries[0].isIntersecting && !hasAnimated.current) {
              hasAnimated.current = true;
              let start = 0;
              const duration = 2000;
              const stepTime = 20;
              const totalSteps = duration / stepTime;
              const increment = numericTarget / totalSteps;

              const timer = setInterval(() => {
                start += increment;
                if (start >= numericTarget) {
                  setCount(numericTarget);
                  clearInterval(timer);
                } else {
                  setCount(Math.floor(start));
                }
              }, stepTime);
            }
          },
          { threshold: 0.5 }
        );

        if (counterRef.current) observer.observe(counterRef.current);
        return () => observer.disconnect();
      }, [target]);

      return (
        <span ref={counterRef}>
          {count.toLocaleString('mr-IN')}{suffix}
        </span>
      );
    };

    const TiltCard = ({ children, className = "", onClick }) => {
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        const card = cardRef.current;
        if (!card) return;
        card.classList.remove('tilt-card-reset');
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
      };

      const handleMouseLeave = () => {
        const card = cardRef.current;
        if (!card) return;
        card.classList.add('tilt-card-reset');
        card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
      };

      return (
        <div 
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          onClick={onClick}
          className={`tilt-card ${className}`}
        >
          {children}
        </div>
      );
    };

    const RippleButton = ({ children, onClick, className = "" }) => {
      const handleRipple = (e) => {
        const btn = e.currentTarget;
        const circle = document.createElement('span');
        const diameter = Math.max(btn.clientWidth, btn.clientHeight);
        const radius = diameter / 2;
        const rect = btn.getBoundingClientRect();
        
        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${e.clientX - rect.left - radius}px`;
        circle.style.top = `${e.clientY - rect.top - radius}px`;
        circle.classList.add('ripple');
        
        const existingRipple = btn.getElementsByClassName('ripple')[0];
        if (existingRipple) existingRipple.remove();
        
        btn.appendChild(circle);
        if (onClick) onClick(e);
      };

      return (
        <button onClick={handleRipple} className={`ripple-btn ${className}`}>
          {children}
        </button>
      );
    };

    // --- Components ---

    const Marquee = () => {
      return (
        <div className="bg-vanilla-700 text-white h-9 relative flex items-center z-50">
          <div className="max-w-7xl mx-auto w-full flex items-center relative h-full">

              <div className="marquee-content">
                <span className="mx-4 text-vanilla-300">✦</span> पेढांबे ग्रामपंचायत अधिकृत माहितीपर संकेतस्थळावर आपले स्वागत आहे. 
                <span className="mx-4 text-vanilla-300">✦</span> महात्मा गांधी तंटामुक्त गाव पुरस्कार प्राप्त पेढांबे ग्रामपंचायत. 
                <span className="mx-4 text-vanilla-300">✦</span> स्वच्छ गाव, सुंदर गाव, समृद्ध पेढांबे!
              </div>
            </div>
          </div>
        </div>
      );
    };

    const Navbar = () => {
      const [isOpen, setIsOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 40);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const navLinks = [
        { name: "मुखपृष्ठ", href: "#home" },
        { name: "आमच्याबद्दल", href: "#about" },
        { name: "प्रशासन", href: "#local-body" },
        { name: "संस्कृती", href: "#culture" },
        { name: "पर्यटन", href: "#tourism" },
        { name: "संपर्क", href: "#contact" },

            <a href="#home" className="flex items-center gap-3 group">
              <div className={`w-10 h-10 rounded-xl bg-gradient-to-br from-vanilla-400 to-vanilla-600 text-white font-black text-xl flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform`}>
                ग्रा
              </div>
              <div>
                <h1 className="font-black text-xl text-stone-900 leading-tight">पेढांबे ग्रामपंचायत</h1>
                <p className="text-[9px] text-vanilla-600 uppercase tracking-widest font-extrabold">Grampanchayat</p>
              </div>
            </a>

            {/* Desktop Nav */}
            <nav className="hidden md:flex gap-8 items-center">
              {navLinks.map((link, idx) => (
                <a 
                  key={idx} 
                  href={link.href}
                  className="text-stone-700 font-bold hover:text-vanilla-600 transition-colors text-sm uppercase tracking-wide"
                >
                  {link.name}
                </a>
              ))}
              <a href="#contact">
                <button className="bg-vanilla-600 hover:bg-vanilla-700 text-white px-5 py-2 rounded-full font-bold text-sm shadow-md hover:shadow-lg transition-all hover:-translate-y-0.5 ml-2">
                  संपर्क साधा
                </button>
              </a>
            </nav>

            {/* Mobile Toggle */}
            <button 
              className="md:hidden p-2 text-stone-700 hover:bg-vanilla-100 rounded-lg transition-colors"
              onClick={() => setIsOpen(!isOpen)}
            >
              <Icon name={isOpen ? "x" : "menu"} className="w-6 h-6" />
            </button>
          </div>

          {/* Mobile Nav */}
          {isOpen && (
            <div className="md:hidden absolute top-full left-0 w-full bg-white shadow-xl border-t border-vanilla-100 animate-fade-in flex flex-col">
              {navLinks.map((link, idx) => (
                <a 
                  key={idx} 
                  href={link.href}
                  onClick={() => setIsOpen(false)}
                  className="px-6 py-4 border-b border-vanilla-50 text-stone-800 font-bold hover:bg-vanilla-50 hover:text-vanilla-600 transition-colors"
                >
                  {link.name}
                </a>
              ))}
            </div>
          )}
        </header>
      );
    };

    const HeroSection = () => {
      const triggerConfetti = () => {
        if (window.confetti) {
          window.confetti({ particleCount: 100, spread: 90, origin: { y: 0.6 }, colors: ['#ea580c', '#10b981', '#F3E5AB', '#ffffff'] });
        }
      };

      return (
        <section id="home" className="relative min-h-[90svh] flex items-center justify-center overflow-hidden pt-10 pb-20 bg-vanilla-50">
          <div className="absolute top-20 -left-32 w-96 h-96 bg-vanilla-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>
          <div className="absolute top-40 -right-32 w-96 h-96 bg-vanilla-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>
          <div className="absolute -bottom-32 left-1/2 w-96 h-96 bg-white rounded-full mix-blend-overlay filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
          <div className="absolute inset-0 hero-pattern z-0"></div>

          <div className="absolute inset-0 z-0">
            <img 
              src={resolveImg("Village.jpg")} 
              alt="Pedambe Coastal Village" 
              className="w-full h-full object-cover opacity-40 scale-105 transform transition-transform duration-[20s] hover:scale-110 mix-blend-luminosity"
              onError={(e) => {
                e.target.onerror = null;
                e.target.src = 'https://images.unsplash.com/photo-1541888946425-d0fbb186a5b3?auto=format&fit=crop&w=1600&q=80';
              }}
            />
            <div className="absolute inset-0 bg-gradient-to-b from-vanilla-50/90 via-vanilla-50/70 to-vanilla-50 backdrop-blur-[1px]"></div>
          </div>

          <div className="relative z-10 text-center px-4 max-w-6xl mx-auto js-reveal is-visible mt-8 w-full">
            <div 
              onClick={triggerConfetti}
              className="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-white/80 backdrop-blur-md border border-vanilla-300 mb-8 text-xs sm:text-sm text-vanilla-800 shadow-sm float-anim cursor-pointer hover:border-vanilla-500 hover:bg-white transition-all hover:scale-105"
              title="क्लिक करा"
            >
              <Icon name="map-pin" className="w-4 h-4 text-vanilla-600" />
              <span className="font-bold tracking-wide">चिपळूण तालुका, रत्नागिरी जिल्हा, महाराष्ट्र</span>

            <h1 className="text-6xl sm:text-7xl md:text-8xl font-black text-stone-900 mb-6 tracking-tight leading-tight drop-shadow-sm">
              पेढांबे ग्रामपंचायत

            <p className="text-lg sm:text-2xl text-stone-700 mb-12 max-w-3xl mx-auto leading-relaxed font-semibold">
              वाशिष्टी नदीच्या निसर्गरम्य पट्ट्यातील ऐतिहासिक व समृद्ध पेढांबे गाव. प्रशासकीय माहिती, शेती, सण आणि विकासकामांचा आढावा.

            <div className="flex flex-col sm:flex-row gap-5 justify-center items-center mb-20">

                  <Icon name="book-open" className="w-6 h-6" /> गावाची माहिती
                </RippleButton>
              </a>
              <a href="#local-body">
                <RippleButton className="w-full sm:w-auto bg-white/90 backdrop-blur-lg hover:bg-white text-stone-900 border-2 border-vanilla-300 px-8 py-4 rounded-2xl font-black hover:-translate-y-1 transition-all duration-300 shadow-lg flex items-center justify-center gap-3 text-lg hover:border-vanilla-500">
                  <Icon name="users" className="w-6 h-6 text-vanilla-600" /> स्थानिक प्रशासन
                </RippleButton>
              </a>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 max-w-5xl mx-auto">
              {[
                { label: "लोकसंख्या (२०११)", val: "3224", icon: "users" },
                { label: "एकूण घरे", val: "726", icon: "home" },
                { label: "क्षेत्रफळ (हेक्टर)", val: "97", icon: "map" },
                { label: "साक्षरता प्रमाण", val: "78", suffix: "%", icon: "graduation-cap" }
              ].map((item, idx) => (
                <div key={idx} className="relative group bg-white/60 backdrop-blur-xl border border-white/80 rounded-3xl p-5 sm:p-6 text-center shadow-xl hover:shadow-2xl hover:border-vanilla-400 transition-all duration-300 hover:-translate-y-2 overflow-hidden">
                  <div className="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <Icon name={item.icon} className="w-24 h-24 text-vanilla-700" />
                  </div>
                  <div className="relative z-10">
                    <p className="text-xs sm:text-sm text-stone-600 font-bold uppercase tracking-wider mb-2">{item.label}</p>
                    <p className="text-3xl sm:text-4xl font-black text-vanilla-700">

                </div>

          </div>

      );

    const AboutSection = ({ onOpenLightbox }) => {
      return (
        <section id="about" className="py-24 px-4 md:px-8 max-w-7xl mx-auto bg-white js-reveal">
          <div className="grid md:grid-cols-2 gap-16 items-center">
            <div>
              <div className="inline-flex items-center gap-2 bg-vanilla-100 text-vanilla-800 px-4 py-2 rounded-full text-xs font-black tracking-wide mb-6 border border-vanilla-300 pulse-glow">
                <Icon name="landmark" className="w-4 h-4" /> परिचयात्मक पार्श्वभूमी
              </div>
              <h2 className="text-4xl sm:text-5xl font-black mb-8 text-stone-900 leading-tight">
                पेढांबे गावाची <span className="text-vanilla-600">सविस्तर माहिती</span>
              </h2>
              <div className="space-y-5 text-stone-600 leading-relaxed text-lg text-justify font-medium">
                <p>
                  पेढांबे हे महाराष्ट्रातील रत्नागिरी जिल्ह्यातील <span className="font-bold text-stone-900 bg-vanilla-100 px-1 rounded">चिपळूण तालुक्यातील</span> एक अतिशय सुंदर, समृद्ध व ऐतिहासिक गाव आहे. चिपळूण उपजिल्हा केंद्रापासून अवघ्या १५ किमी अंतरावर व रत्नागिरी जिल्हा मुख्यालयापासून ८० किमी अंतरावर हे गाव स्थित आहे.

                <p>
                  गावचे एकूण भौगोलिक क्षेत्रफळ <span className="font-bold text-stone-900">९७ हेक्टर</span> आहे. गावाचा कारभार स्वतंत्र पेढांबे ग्रामपंचायतीद्वारे चालवला जातो. गावाला सुंदर निसर्ग, वाशिष्टी नदीचे खोरे आणि फळबागांचे वरदान लाभले आहे.

                <p>
